<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSG Training Division — Operating Platform (Pilot)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fafaf9;
      color: #1c1917;
      -webkit-font-smoothing: antialiased;
    }
    .font-editorial {
      font-family: 'IBM Plex Serif', Georgia, serif;
    }
    /* Elegant subtle border transitions */
    .card-border {
      border: 1px solid #e7e5e4;
      background-color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- TOP BRANDING & NAVIGATION BAR -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-5xl mx-auto px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">
          <span>FSG Training Division</span>
          <span>·</span>
          <span>Operating Platform (Pilot)</span>
        </div>
        <h1 class="text-2xl font-editorial font-semibold text-stone-900 tracking-tight">
          FSG Training Division — Operating Platform
        </h1>
      </div>

      <!-- Demonstration Badge & Action -->
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-stone-100 text-stone-700 border border-stone-300">
          <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
          PILOT — DEMONSTRATION SYSTEM
        </span>
        <button
          onclick="openModal()"
          class="px-3.5 py-1.5 bg-stone-900 hover:bg-stone-800 text-white rounded-md text-xs font-medium shadow-sm transition"
        >
          + New Booking
        </button>
      </div>
    </div>

    <!-- DOCUMENT TABS (CLEAN EDITORIAL TABS) -->
    <div class="max-w-5xl mx-auto px-6 flex gap-8 border-t border-stone-200 text-sm overflow-x-auto" id="tab-nav">
      <button onclick="setTab('reporting')" id="tab-btn-reporting" class="py-3 font-medium border-b-2 border-stone-900 text-stone-900 transition flex items-center gap-2 whitespace-nowrap">
        Reporting
      </button>
      <button onclick="setTab('bookings')" id="tab-btn-bookings" class="py-3 font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-900 transition flex items-center gap-2 whitespace-nowrap">
        Bookings & Occupancy
      </button>
      <button onclick="setTab('costing')" id="tab-btn-costing" class="py-3 font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-900 transition flex items-center gap-2 whitespace-nowrap">
        Costing & Profitability
      </button>
      <button onclick="setTab('certificates')" id="tab-btn-certificates" class="py-3 font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-900 transition flex items-center gap-2 whitespace-nowrap">
        Certificates (6)
      </button>
      <button onclick="setTab('enquiries')" id="tab-btn-enquiries" class="py-3 font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-900 transition flex items-center gap-2 whitespace-nowrap">
        Live Enquiries (2)
      </button>
    </div>
  </header>

  <!-- MAIN DOCUMENT CONTENT -->
  <main class="max-w-5xl mx-auto px-6 py-10 flex-1 w-full" id="main-content">
    <!-- Rendered via JavaScript -->
  </main>

  <!-- ADD BOOKING MODAL -->
  <div id="modal-backdrop" class="fixed inset-0 bg-stone-900/50 backdrop-blur-xs flex items-center justify-center z-50 p-4 hidden">
    <div class="bg-white border border-stone-200 rounded-xl w-full max-w-md p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4 border-b border-stone-200 pb-3">
        <h3 class="text-base font-semibold text-stone-900 font-editorial">Add New Course Booking</h3>
        <button onclick="closeModal()" class="text-stone-400 hover:text-stone-600 text-lg font-bold">&times;</button>
      </div>
      <form id="booking-form" onsubmit="handleFormSubmit(event)" class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-medium text-stone-700 mb-1">Course Title</label>
          <input
            type="text"
            id="form-title"
            required
            placeholder="e.g. NFPA 1041 Fire Instructor I"
            class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm outline-none focus:border-stone-900"
          />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1">Status</label>
            <select
              id="form-status"
              class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm outline-none focus:border-stone-900"
            >
              <option value="provisional">Provisional</option>
              <option value="confirmed">Confirmed</option>
              <option value="delivered">Delivered</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1">Duration (Days)</label>
            <input
              type="number"
              id="form-days"
              required
              value="5"
              class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm outline-none focus:border-stone-900"
            />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1">Seats Filled</label>
            <input
              type="number"
              id="form-seats"
              required
              value="15"
              class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm outline-none focus:border-stone-900"
            />
          </div>
          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1">Total Room Capacity</label>
            <input
              type="number"
              id="form-totalseats"
              required
              value="25"
              class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm outline-none focus:border-stone-900"
            />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-stone-700 mb-1">Course Fee Billed (AED)</label>
          <input
            type="number"
            id="form-billed"
            required
            value="100000"
            class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm outline-none focus:border-stone-900"
          />
        </div>

        <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-stone-200">
          <button
            type="button"
            onclick="closeModal()"
            class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-md text-xs font-medium transition"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-md text-xs font-medium shadow-sm transition"
          >
            Add Booking
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-stone-200 py-6 text-center text-xs text-stone-500 mt-auto bg-white">
    FSG Training Division — Operating Platform (Pilot) · Synced with kirthregis/Cross-Claude-Code
  </footer>

  <!-- APP LOGIC -->
  <script>
    // Constants

    const FOOD_RATE = 90;
    const FIREGROUND_RATE = 1100;

    // Application State
    const state = {

          totalSeats: 30,
          days: 5,

          crewDays: 5,

          netKept: 70790,

          location: 'FSG Fireground 1'
        },
        {
          id: 'BK-2026-002',
          title: 'NFPA 1081 Interior Structural Fire Fighting',
          status: 'delivered',
          seatsFilled: 18,
          totalSeats: 25,
          days: 5,
          billed: 178700,
          crewDays: 5,
          groundDays: 5,

          days: 5,
          billed: 125000,

          groundDays: 5,
          netKept: 104875,
          margin: 84,
          date: '24-28 Aug 2026',
          location: 'FSG Industrial Pad'
        }
      ],
      certificates: [
        { id: 'FSG-CERT-2026-0101', student: 'Ahmed Al-Mansoori', course: 'BK-2026-001 HazMat Incident Command', date: '15 Jul 2026', status: 'Issued' },
        { id: 'FSG-CERT-2026-0102', student: 'Rashid Al-Nuaimi', course: 'BK-2026-001 HazMat Incident Command', date: '15 Jul 2026', status: 'Issued' },
        { id: 'FSG-CERT-2026-0103', student: 'Khalid Al-Dhaheri', course: 'BK-2026-002 NFPA 1081 Interior Structural', date: '23 Jul 2026', status: 'Issued' },
        { id: 'FSG-CERT-2026-0104', student: 'Sultan Al-Kaabi', course: 'BK-2026-002 NFPA 1081 Interior Structural', date: '23 Jul 2026', status: 'Issued' },
        { id: 'FSG-CERT-2026-0105', student: 'Omar Al-Suwaidi', course: 'BK-2026-002 NFPA 1081 Interior Structural', date: '23 Jul 2026', status: 'Issued' },
        { id: 'FSG-CERT-2026-0106', student: 'Faisal Al-Mazrouei', course: 'BK-2026-002 NFPA 1081 Interior Structural', date: '23 Jul 2026', status: 'Issued' }
      ],
      enquiries: [
        { id: 'ENQ-2026-101', client: 'Abu Dhabi National Energy (TAQA)', course: 'NFPA 1081 Interior Structural', seats: 20, status: 'Quoted', value: 140000, date: '28 Jul 2026' },
        { id: 'ENQ-2026-102', client: 'Al Ain Distribution Co.', course: 'HazMat Incident Command', seats: 15, status: 'New', value: 95000, date: '01 Aug 2026' }
      ],
      calc: {
        fee: 130000,
        seats: 20,
        days: 5,
        groundDays: 4
      }
    };

    function setTab(tabName) {
      state.activeTab = tabName;
      const buttons = document.querySelectorAll('#tab-nav button');
      buttons.forEach(btn => {
        if (btn.id === `tab-btn-${tabName}`) {
          btn.className = "py-3 font-medium border-b-2 border-stone-900 text-stone-900 transition flex items-center gap-2 whitespace-nowrap";
        } else {
          btn.className = "py-3 font-medium border-b-2 border-transparent text-stone-500 hover:text-stone-900 transition flex items-center gap-2 whitespace-nowrap";
        }
      });
      render();
    }

    function openModal() {
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const title = document.getElementById('form-title').value;
      const status = document.getElementById('form-status').value;
      const days = Number(document.getElementById('form-days').value);
      const seatsFilled = Number(document.getElementById('form-seats').value);
      const totalSeats = Number(document.getElementById('form-totalseats').value);
      const billed = Number(document.getElementById('form-billed').value);

      const nextNum = state.courses.length + 1;
      const newId = `BK-2026-00${nextNum}`;

      const crewCost = CREW_RATE * days;
      const foodCost = FOOD_RATE * seatsFilled * days;
      const groundCost = FIREGROUND_RATE * days;
      const netKept = billed - (crewCost + foodCost + groundCost);
      const margin = Math.round((netKept / billed) * 100) || 0;

      state.courses.push({
        id: newId,
        title,
        status,
        seatsFilled,
        totalSeats,
        days,
        billed,
        crewDays: days,
        groundDays: days,
        netKept,
        margin,
        date: 'Sept 2026',
        location: 'FSG Fireground 1'
      });

      closeModal();
      render();
    }

    function updateCalculator() {
      const feeInput = document.getElementById('calc-fee');
      const seatsInput = document.getElementById('calc-seats');
      const daysInput = document.getElementById('calc-days');
      const groundInput = document.getElementById('calc-ground');

      if (!feeInput) return;

      state.calc.fee = Number(feeInput.value);
      state.calc.seats = Number(seatsInput.value);
      state.calc.days = Number(daysInput.value);
      state.calc.groundDays = Number(groundInput.value);

      const crewCost = CREW_RATE * state.calc.days;
      const foodCost = FOOD_RATE * state.calc.seats * state.calc.days;
      const groundCost = FIREGROUND_RATE * state.calc.groundDays;
      const totalCost = crewCost + foodCost + groundCost;
      const netKept = state.calc.fee - totalCost;
      const margin = Math.round((netKept / state.calc.fee) * 100) || 0;

      document.getElementById('sim-crew-cost').innerText = `AED ${crewCost.toLocaleString()}`;
      document.getElementById('sim-food-cost').innerText = `AED ${foodCost.toLocaleString()}`;
      document.getElementById('sim-ground-cost').innerText = `AED ${groundCost.toLocaleString()}`;
      document.getElementById('sim-net-kept').innerText = `AED ${netKept.toLocaleString()}`;
      document.getElementById('sim-margin').innerText = `${margin}%`;
    }

    /* =========================================================
       TAB 1: REPORTING (EXACT CLAUDE ARTIFACT LOOK & LAYOUT)
       ========================================================= */

              <p class="text-xs text-stone-500 mt-2">
                1 invoice sent, not yet paid
              </p>
            </div>

            <div class="card-border p-5 rounded-lg shadow-2xs">
              <p class="text-xs font-semibold text-stone-500 uppercase tracking-wider">Certificates issued</p>
              <p class="text-3xl font-bold text-stone-900 mt-2">6</p>
              <p class="text-xs text-stone-500 mt-2">
                each with a unique register number
              </p>
            </div>

            <div class="card-border p-5 rounded-lg shadow-2xs">
              <p class="text-xs font-semibold text-stone-500 uppercase tracking-wider">Live enquiries</p>
              <p class="text-3xl font-bold text-stone-900 mt-2">2</p>
              <p class="text-xs text-stone-500 mt-2">
                new or quoted, not yet decided

          </div>

          <!-- SECTION: Money billed, this month against last -->
          <div class="card-border p-8 rounded-lg shadow-2xs">
            <h3 class="text-lg font-editorial font-bold text-stone-900">

            <p class="text-sm text-stone-500 mt-1 mb-6">

                <div class="flex justify-between text-sm font-medium mb-1.5">

              ${state.courses.map(course => {

                      <div

    /* =========================================================
       TAB 2: BOOKINGS REGISTER & OCCUPANCY

    function renderBookings() {
      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-stone-200 pb-5">

            </div>
            <button
              onclick="openModal()"
              class="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-md text-xs font-medium shadow-sm transition"

              + Add New Booking
            </button>
          </div>

          <div class="card-border rounded-lg overflow-hidden">
            <div class="overflow-x-auto">

                <tbody class="divide-y divide-stone-200 text-sm">
                  ${state.courses.map(course => {

                                      'bg-amber-50 text-amber-800 border border-amber-200';
                    return `
                      <tr class="hover:bg-stone-50/60 transition">
                        <td class="py-4 px-6 font-medium text-stone-900">
                          <div class="font-semibold">${course.id}</div>
                          <div class="text-xs text-stone-500">${course.title}</div>
                        </td>
                        <td class="py-4 px-6">
                          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium uppercase ${statusClass}">
                            ${course.status}
                          </span>
                        </td>
                        <td class="py-4 px-6 text-xs text-stone-600">
                          <div>${course.date}</div>
                          <div class="text-stone-400">${course.location}</div>
                        </td>
                        <td class="py-4 px-6 w-56">
                          <div class="flex justify-between text-xs font-medium mb-1">
                            <span>${course.seatsFilled} of ${course.totalSeats}</span>
                            <span class="${isGreen ? 'text-emerald-700 font-bold' : 'text-stone-600'}">${pct}%</span>
                          </div>
                          <div class="w-full bg-stone-100 h-2 rounded-full overflow-hidden border border-stone-200">
                            <div
                              class="h-full ${isGreen ? 'bg-emerald-600' : pct >= 75 ? 'bg-amber-500' : 'bg-stone-400'}"
                              style="width: ${pct}%"
                            ></div>
                          </div>
                        </td>
                        <td class="py-4 px-6 text-right font-mono font-semibold text-stone-900">
                          AED ${course.billed.toLocaleString()}.00
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       TAB 3: COSTING REGISTER & CALCULATOR
       ========================================================= */
    function renderCosting() {
      return `
        <div class="space-y-10">
          <div class="border-b border-stone-200 pb-5">
            <h2 class="text-2xl font-editorial font-bold text-stone-900">What each delivered course kept, roughly</h2>
            <p class="text-sm text-stone-500 mt-1">
              Money billed, less crew at <span class="text-stone-900 font-medium">AED 2,225.00/day</span>, feeding at <span class="text-stone-900 font-medium">AED 90/head/day</span>, and ground at <span class="text-stone-900 font-medium">AED 1,100.00/day</span>.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${state.courses.map(course => `
              <div class="card-border p-6 rounded-lg">
                <div class="flex justify-between items-start">
                  <div>
                    <span class="text-xs font-semibold text-stone-500 uppercase">${course.id}</span>
                    <h3 class="text-base font-bold text-stone-900 mt-0.5">${course.title}</h3>
                    <p class="text-xs text-stone-500">${course.days} days · ${course.seatsFilled} students</p>
                  </div>
                  <div class="text-right">
                    <span class="text-xl font-bold font-mono text-emerald-700">
                      AED ${course.netKept.toLocaleString()}.00
                    </span>
                    <p class="text-xs font-semibold text-stone-500 mt-0.5">${course.margin}% Net Margin</p>
                  </div>
                </div>

                <div class="mt-5 border-t border-stone-200 pt-4 space-y-2 text-xs text-stone-600 font-mono">
                  <div class="flex justify-between font-sans text-stone-700">
                    <span>Total Billed (before VAT):</span>
                    <span class="font-mono font-semibold">AED ${course.billed.toLocaleString()}.00</span>
                  </div>
                  <div class="flex justify-between">
                    <span>Crew Cost (${course.crewDays}d @ AED 2,225):</span>
                    <span>- AED ${(CREW_RATE * course.crewDays).toLocaleString()}.00</span>
                  </div>
                  <div class="flex justify-between">
                    <span>Feeding (${course.seatsFilled} pax × ${course.days}d @ AED 90):</span>
                    <span>- AED ${(FOOD_RATE * course.seatsFilled * course.days).toLocaleString()}.00</span>
                  </div>
                  <div class="flex justify-between">
                    <span>Fireground (${course.groundDays}d @ AED 1,100):</span>
                    <span>- AED ${(FIREGROUND_RATE * course.groundDays).toLocaleString()}.00</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Interactive Simulator -->
          <div class="card-border p-8 rounded-lg bg-stone-50/50">
            <h3 class="text-lg font-editorial font-bold text-stone-900">Course Margin Simulator</h3>
            <p class="text-xs text-stone-500 mt-1">Model different course fees and student counts to test FSG margin rules.</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
              <div>
                <label class="block text-xs font-medium text-stone-700 mb-1">Course Fee Billed (AED)</label>
                <input
                  type="number"
                  id="calc-fee"
                  value="${state.calc.fee}"
                  oninput="updateCalculator()"
                  class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm focus:border-stone-900 outline-none"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-stone-700 mb-1">Seats Filled</label>
                <input
                  type="number"
                  id="calc-seats"
                  value="${state.calc.seats}"
                  oninput="updateCalculator()"
                  class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm focus:border-stone-900 outline-none"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-stone-700 mb-1">Crew Days (@ AED 2,225)</label>
                <input
                  type="number"
                  id="calc-days"
                  value="${state.calc.days}"
                  oninput="updateCalculator()"
                  class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm focus:border-stone-900 outline-none"
                />
              </div>
              <div>
                <label class="block text-xs font-medium text-stone-700 mb-1">Fireground Days (@ AED 1,100)</label>
                <input
                  type="number"
                  id="calc-ground"
                  value="${state.calc.groundDays}"
                  oninput="updateCalculator()"
                  class="w-full bg-white border border-stone-300 rounded-md px-3 py-2 text-stone-900 text-sm focus:border-stone-900 outline-none"
                />
              </div>
            </div>

            <div class="mt-6 p-5 bg-white rounded-lg border border-stone-200 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div class="flex gap-6 text-xs text-stone-600 font-mono">
                <div>
                  <span class="block text-stone-400 font-sans">Crew Total</span>
                  <span class="font-semibold text-stone-900" id="sim-crew-cost">AED 0</span>
                </div>
                <div>
                  <span class="block text-stone-400 font-sans">Feeding Total</span>
                  <span class="font-semibold text-stone-900" id="sim-food-cost">AED 0</span>
                </div>
                <div>
                  <span class="block text-stone-400 font-sans">Ground Total</span>
                  <span class="font-semibold text-stone-900" id="sim-ground-cost">AED 0</span>
                </div>
              </div>

              <div class="text-right">
                <span class="text-xs text-stone-500 block font-sans">Projected Net Kept:</span>
                <span class="text-2xl font-bold font-mono text-emerald-700" id="sim-net-kept">AED 0</span>
                <span class="text-sm font-semibold text-stone-600 ml-2" id="sim-margin">(0%)</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       TAB 4: CERTIFICATES REGISTER
       ========================================================= */
    function renderCertificates() {
      return `
        <div class="space-y-6">
          <div class="border-b border-stone-200 pb-5">
            <h2 class="text-2xl font-editorial font-bold text-stone-900">Certificates issued (6)</h2>
            <p class="text-sm text-stone-500 mt-1">Each certificate is issued with a unique register number.</p>
          </div>

          <div class="card-border rounded-lg overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-stone-200 bg-stone-50 text-stone-500 text-xs font-semibold uppercase tracking-wider">
                  <th class="py-3.5 px-6">Register Number</th>
                  <th class="py-3.5 px-6">Student Name</th>
                  <th class="py-3.5 px-6">Course Ref</th>
                  <th class="py-3.5 px-6">Issue Date</th>
                  <th class="py-3.5 px-6 text-right">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-stone-200 text-sm">
                ${state.certificates.map(cert => `
                  <tr class="hover:bg-stone-50/60 transition">
                    <td class="py-4 px-6 font-mono font-medium text-emerald-800">${cert.id}</td>
                    <td class="py-4 px-6 font-semibold text-stone-900">${cert.student}</td>
                    <td class="py-4 px-6 text-xs text-stone-600">${cert.course}</td>
                    <td class="py-4 px-6 text-xs text-stone-500">${cert.date}</td>
                    <td class="py-4 px-6 text-right">
                      <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                        ${cert.status}
                      </span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    /* =========================================================
       TAB 5: LIVE ENQUIRIES PIPELINE
       ========================================================= */
    function renderEnquiries() {
      return `
        <div class="space-y-6">
          <div class="border-b border-stone-200 pb-5">
            <h2 class="text-2xl font-editorial font-bold text-stone-900">Live enquiries (2)</h2>
            <p class="text-sm text-stone-500 mt-1">New or quoted training inquiries under active evaluation.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${state.enquiries.map(enq => {
              const badge = enq.status === 'Quoted' ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-purple-50 text-purple-700 border border-purple-200';
              return `
                <div class="card-border p-6 rounded-lg flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start">
                      <span class="text-xs font-mono font-semibold text-stone-500">${enq.id}</span>
                      <span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${badge}">
                        ${enq.status}
                      </span>
                    </div>
                    <h3 class="text-base font-bold text-stone-900 mt-2">${enq.client}</h3>
                    <p class="text-xs text-stone-600 mt-1">Course Ref: <span class="text-stone-900 font-medium">${enq.course}</span></p>
                    <p class="text-xs text-stone-500 mt-1">Estimated Pax: ${enq.seats} students</p>
                  </div>

                  <div class="mt-6 border-t border-stone-200 pt-4 flex justify-between items-center">
                    <div>
                      <span class="text-xs text-stone-500 block">Quoted Value:</span>
                      <span class="text-lg font-bold font-mono text-stone-900">AED ${enq.value.toLocaleString()}.00</span>
                    </div>
                    <span class="text-xs text-stone-400">${enq.date}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      const container = document.getElementById('main-content');
      if (state.activeTab === 'reporting') {
        container.innerHTML = renderReporting();
      } else if (state.activeTab === 'bookings') {
        container.innerHTML = renderBookings();
      } else if (state.activeTab === 'costing') {
        container.innerHTML = renderCosting();
        updateCalculator();
      } else if (state.activeTab === 'certificates') {
        container.innerHTML = renderCertificates();
      } else if (state.activeTab === 'enquiries') {
        container.innerHTML = renderEnquiries();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
    render();
  </script>
</body>
</html>
