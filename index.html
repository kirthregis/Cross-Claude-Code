      const [calcDays, setCalcDays] = useState(5);

      const FOOD_RATE = 90;
      const FIREGROUND_RATE = 1100;

      // Calculate simulator costs
      const simCrewCost = CREW_RATE * calcDays;
      const simFoodCost = FOOD_RATE * calcSeats * calcDays;
      const simGroundCost = FIREGROUND_RATE * calcGroundDays;
      const simTotalCost = simCrewCost + simFoodCost + simGroundCost;
      const simNetKept = calcFee - simTotalCost;
      const simMargin = Math.round((simNetKept / calcFee) * 100) || 0;

      // Modal state for adding a booking
      const [showModal, setShowModal] = useState(false);
      const [newBooking, setNewBooking] = useState({
        title: '',
        status: 'provisional',
        seatsFilled: 15,
        totalSeats: 25,
        days: 5,
        billed: 100000
      });

      const handleAddBooking = (e) => {
        e.preventDefault();
        const nextNum = courses.length + 1;
        const newId = `BK-2026-00${nextNum}`;
        const crewCost = CREW_RATE * newBooking.days;
        const foodCost = FOOD_RATE * newBooking.seatsFilled * newBooking.days;
        const groundCost = FIREGROUND_RATE * newBooking.days;
        const net = newBooking.billed - (crewCost + foodCost + groundCost);
        const margin = Math.round((net / newBooking.billed) * 100) || 0;

        setCourses([...courses, {
          id: newId,
          ...newBooking,
          crewDays: newBooking.days,
          groundDays: newBooking.days,
          netKept: net,
          margin: margin,
          date: 'Sept 2026',
          location: 'FSG Fireground 1'
        }]);
        setShowModal(false);

            {activeTab === 'dashboard' && (

                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-sm">
                    <p className="text-xs font-medium text-slate-400 uppercase tracking-wider">Waiting to be Paid</p>
                    <p className="text-3xl font-bold text-amber-400 mt-2">AED 81,270.00</p>
                    <p className="text-xs text-slate-400 mt-2">

                                <div className="text-slate-500">{course.location}</div>
                              </td>
                              <td className="py-4 px-4 w-64">
                                <div className="flex justify-between text-xs font-medium mb-1">
                                  <span>{course.seatsFilled} of {course.totalSeats} seats</span>

                                </div>

            {activeTab === 'costing' && (

                    Money billed, less the crew at <span className="text-white font-medium">AED 2,225.00 a day</span>, feeding people at <span className="text-white font-medium">AED 90 a head a day</span>, and the training ground at <span className="text-white font-medium">AED 1,100.00 a fireground day</span>. A rough working figure — the full cost sheets live in the costing register.
                  </p>
                </div>

                {/* Course Margins Cards */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {courses.map(course => (
                    <div key={course.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-xs font-semibold text-slate-400 uppercase">{course.id}</span>
                          <h3 className="text-base font-bold text-white mt-0.5">{course.title}</h3>

                        </div>

                        value={calcGroundDays}
                        onChange={(e) => setCalcGroundDays(Number(e.target.value))}
                        className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm focus:border-red-500 outline-none"
                      />
                    </div>
                  </div>

                  <div className="mt-6 p-4 bg-slate-950 rounded-lg border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div className="flex gap-6 text-xs text-slate-400">
                      <div>
                        <span className="block text-slate-500">Crew Total</span>
                        <span className="font-semibold text-slate-200">AED {simCrewCost.toLocaleString()}</span>
                      </div>
                      <div>
                        <span className="block text-slate-500">Feeding Total</span>
                        <span className="font-semibold text-slate-200">AED {simFoodCost.toLocaleString()}</span>
                      </div>
                      <div>
                        <span className="block text-slate-500">Ground Total</span>
                        <span className="font-semibold text-slate-200">AED {simGroundCost.toLocaleString()}</span>
                      </div>
                    </div>

                    <div className="text-right">
                      <span className="text-xs text-slate-400 block">Projected Net Kept:</span>
                      <span className="text-2xl font-extrabold text-emerald-400">AED {simNetKept.toLocaleString()}</span>
                      <span className="text-xs font-bold text-slate-300 ml-2">({simMargin}% margin)</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: CERTIFICATE REGISTER */}
            {activeTab === 'certificates' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-lg font-semibold text-white">Certificates Register</h2>
                  <p className="text-xs text-slate-400">Unique register numbers issued to graduates of FSG Training courses.</p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950/60 text-slate-400 text-xs uppercase tracking-wider">
                        <th className="py-3 px-4">Register Number</th>
                        <th className="py-3 px-4">Student Name</th>
                        <th className="py-3 px-4">Course Ref</th>
                        <th className="py-3 px-4">Issue Date</th>
                        <th className="py-3 px-4 text-right">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-sm">
                      {certificates.map(cert => (
                        <tr key={cert.id} className="hover:bg-slate-800/40 transition">
                          <td className="py-4 px-4 font-mono font-medium text-emerald-400">{cert.id}</td>
                          <td className="py-4 px-4 font-semibold text-white">{cert.student}</td>
                          <td className="py-4 px-4 text-xs text-slate-300">{cert.course}</td>
                          <td className="py-4 px-4 text-xs text-slate-400">{cert.date}</td>
                          <td className="py-4 px-4 text-right">
                            <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
                              {cert.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 5: LIVE ENQUIRIES */}
            {activeTab === 'enquiries' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-lg font-semibold text-white">Live Enquiries & Pipeline</h2>
                  <p className="text-xs text-slate-400">New or quoted training requirements under client evaluation.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {enquiries.map(enq => (
                    <div key={enq.id} className="bg-slate-900 border border-slate-800 p-6 rounded-xl flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-mono font-semibold text-sky-400">{enq.id}</span>
                          <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                            enq.status === 'Quoted' ? 'bg-sky-950 text-sky-400 border border-sky-800' : 'bg-purple-950 text-purple-400 border border-purple-800'
                          }`}>
                            {enq.status}
                          </span>
                        </div>
                        <h3 className="text-base font-bold text-white mt-2">{enq.client}</h3>
                        <p className="text-xs text-slate-300 mt-1">Course Ref: <span className="text-white font-medium">{enq.course}</span></p>
                        <p className="text-xs text-slate-400 mt-1">Estimated Pax: {enq.seats} students</p>
                      </div>

                      <div className="mt-6 border-t border-slate-800/80 pt-4 flex justify-between items-center">
                        <div>
                          <span className="text-xs text-slate-400 block">Quoted Value:</span>
                          <span className="text-lg font-bold text-white">AED {enq.value.toLocaleString()}</span>
                        </div>
                        <span className="text-xs text-slate-400">{enq.date}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ADD BOOKING MODAL */}
          {showModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">Add New Course Booking</h3>
                <form onSubmit={handleAddBooking} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Course Title</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. NFPA 1041 Fire Instructor I"
                      value={newBooking.title}
                      onChange={(e) => setNewBooking({ ...newBooking, title: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm outline-none focus:border-red-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Status</label>
                      <select
                        value={newBooking.status}
                        onChange={(e) => setNewBooking({ ...newBooking, status: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm outline-none focus:border-red-500"
                      >
                        <option value="provisional">Provisional</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="delivered">Delivered</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Duration (Days)</label>
                      <input
                        type="number"
                        required
                        value={newBooking.days}
                        onChange={(e) => setNewBooking({ ...newBooking, days: Number(e.target.value) })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm outline-none focus:border-red-500"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Seats Filled</label>
                      <input
                        type="number"
                        required
                        value={newBooking.seatsFilled}
                        onChange={(e) => setNewBooking({ ...newBooking, seatsFilled: Number(e.target.value) })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm outline-none focus:border-red-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Total Room Capacity</label>
                      <input
                        type="number"
                        required
                        value={newBooking.totalSeats}
                        onChange={(e) => setNewBooking({ ...newBooking, totalSeats: Number(e.target.value) })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm outline-none focus:border-red-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Course Fee Billed (AED)</label>
                    <input
                      type="number"
                      required
                      value={newBooking.billed}
                      onChange={(e) => setNewBooking({ ...newBooking, billed: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm outline-none focus:border-red-500"
                    />
                  </div>

                  <div className="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md text-xs font-semibold transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-md text-xs font-semibold shadow transition"
                    >
                      Add Booking
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            FSG Training Division — Operating Platform Pilot · Developed & Synced for Cross-Claude-Code
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FSGOperatingPlatform />);
  </script>
</body>
</html>
