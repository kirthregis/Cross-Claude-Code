    function setView(viewName) {
      state.view = viewName;
      ['client', 'delegate', 'instructor', 'backoffice', 'guide'].forEach(r => {
        const btn = document.getElementById(`role-btn-${r}`);
        if (!btn) return;
        if (r === viewName) {
          btn.className = "w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-semibold bg-[#d9531f] text-white shadow-sm transition";
        } else {
          btn.className = "w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800/60 transition";
        }
      });

      const headerTitle = document.getElementById('header-title');
      if (viewName === 'client') {
        headerTitle.innerText = "Courses & booking";
      } else if (viewName === 'backoffice') {
        headerTitle.innerText = "Back office · Reporting & Operations";
      } else if (viewName === 'delegate') {
        headerTitle.innerText = "Delegate portal";
      } else if (viewName === 'instructor') {
        headerTitle.innerText = "Instructor tablet";
      } else if (viewName === 'guide') {
        headerTitle.innerText = "Guide & tutorial";
      }

      render();
    }

    function setSection(secName) {
      state.section = secName;
      ['courses', 'company', 'verify'].forEach(s => {
        const btn = document.getElementById(`sec-btn-${s}`);
        if (!btn) return;
        if (s === secName) {
          btn.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-bold text-white bg-slate-800/60 transition text-left";
        } else {
          btn.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800/40 transition text-left";
        }
      });

      if (secName === 'courses') {
        setView('client');
      } else {
        const headerTitle = document.getElementById('header-title');
        if (secName === 'company') headerTitle.innerText = "My company";
        if (secName === 'verify') headerTitle.innerText = "Verify a certificate";
        render();
      }
    }

    function setBackOfficeTab(tabName) {
      state.backOfficeTab = tabName;
      render();
    }

    function toggleCourseBreakout(courseId) {
      if (state.expandedCourseId === courseId) {
        state.expandedCourseId = null;
      } else {
        state.expandedCourseId = courseId;
      }
      render();
    }

    function openModal() {
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('form-title').value;
      const status = document.getElementById('form-status').value;
      const days = Number(document.getElementById('form-days').value);
      const seatsFilled = Number(document.getElementById('form-seats').value);
      const totalSeats = Number(document.getElementById('form-totalseats').value);
      const billed = Number(document.getElementById('form-billed').value);

      const nextNum = state.courses.length + 1;
      const newId = `BK-2026-00${nextNum}`;
      const crewCost = CREW_RATE * days;
      const foodCost = FOOD_RATE * seatsFilled * days;
      const groundCost = FIREGROUND_RATE * days;
      const netKept = billed - (crewCost + foodCost + groundCost);
      const margin = Math.round((netKept / billed) * 100) || 0;

      state.courses.push({
        id: newId,
        title,
        subtitle: `BLENDED — THEORY ONLINE OR SELF-PACED, PRACTICALS IN PERSON · ${days} DAYS`,
        desc: 'Custom scheduled industrial training evolution.',
        dateBadge: 'New Scheduled Date',
        dateBadgeType: 'green',
        status,
        seatsFilled,
        totalSeats,
        days,
        billed,
        crewDays: days,
        groundDays: days,
        netKept,
        margin,
        date: 'Sept 2026',
        location: 'FSG Fireground 1',
        breakout: {
          theory: `${Math.round(days * 2)} Hours Online Theory Module`,
          practical: `${Math.round(days * 5)} Hours Practical Fireground Evolution`,
          prereq: 'Medical Clearance Required',
          pricePerSeat: Math.round(billed / seatsFilled),
          cpd: `${days * 7} Official CPD Credit Hours`
        }
      });

      closeModal();
      render();
    }

    function updateCalculator() {
      const feeInput = document.getElementById('calc-fee');
      const seatsInput = document.getElementById('calc-seats');
      const daysInput = document.getElementById('calc-days');
      const groundInput = document.getElementById('calc-ground');

      if (!feeInput) return;

      state.calc.fee = Number(feeInput.value);
      state.calc.seats = Number(seatsInput.value);
      state.calc.days = Number(daysInput.value);
      state.calc.groundDays = Number(groundInput.value);

      const crewCost = CREW_RATE * state.calc.days;
      const foodCost = FOOD_RATE * state.calc.seats * state.calc.days;
      const groundCost = FIREGROUND_RATE * state.calc.groundDays;
      const totalCost = crewCost + foodCost + groundCost;
      const netKept = state.calc.fee - totalCost;
      const margin = Math.round((netKept / state.calc.fee) * 100) || 0;

      document.getElementById('sim-crew-cost').innerText = `AED ${crewCost.toLocaleString()}`;
      document.getElementById('sim-food-cost').innerText = `AED ${foodCost.toLocaleString()}`;
      document.getElementById('sim-ground-cost').innerText = `AED ${groundCost.toLocaleString()}`;
      document.getElementById('sim-net-kept').innerText = `AED ${netKept.toLocaleString()}`;
      document.getElementById('sim-margin').innerText = `(${margin}% margin)`;
    }

      return `

          <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-xl mb-4">
            🎟️
          </div>
          <h3 class="text-lg font-bold text-slate-900">Instructor Tablet Interface (Pilot)</h3>
          <p class="text-xs text-slate-600 mt-2 leading-relaxed">
            Paperless fireground attendance and practical sign-off. Instructors use this view on the training ground to record live evolutions, safety checklists, and NFPA 1081 skill evaluations in real time.
          </p>
          <div class="mt-6 pt-6 border-t border-slate-200 flex justify-center gap-4">
            <button onclick="setView('client')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">
              &larr; Back to Client Website
            </button>
          </div>
        </div>
      `;
    }

    function renderVerifyCertificate() {
      return `
        <div class="bg-white border border-slate-200 rounded-xl p-8 max-w-xl mx-auto shadow-xs">
          <h3 class="text-lg font-bold text-slate-900 mb-2">Verify a Certificate</h3>
          <p class="text-xs text-slate-600 leading-relaxed mb-6">
            Enter an official FSG register number (e.g., <span class="font-mono font-bold text-slate-800">FSG-CERT-2026-0101</span>) to confirm authentic NFPA qualification and issuance status.
          </p>
          <div class="flex gap-2">
            <input
              type="text"
              id="verify-input"
              value="FSG-CERT-2026-0101"
              placeholder="Enter register number..."
              class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm font-mono outline-none focus:border-blue-600"
            />
            <button
              onclick="alert('Certificate Verified: Ahmed Al-Mansoori — BK-2026-001 HazMat Incident Command — Valid')"
              class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow-sm transition"
            >
              Verify Now
            </button>
          </div>
          <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
            <div class="text-xs font-bold text-green-800 mb-1">✓ Verified Example Found in Register</div>
            <div class="text-xs text-green-700 font-mono">FSG-CERT-2026-0101 · Ahmed Al-Mansoori · Issued 15 Jul 2026</div>
          </div>
        </div>
      `;
    }

    function render() {
      const container = document.getElementById('main-content');
      if (state.section === 'verify') {
        container.innerHTML = renderVerifyCertificate();
      } else if (state.view === 'client') {
        container.innerHTML = renderClientWebsite();
      } else if (state.view === 'backoffice') {
        container.innerHTML = renderBackOffice();
        if (state.backOfficeTab === 'costing') updateCalculator();
      } else if (state.view === 'delegate') {
        container.innerHTML = renderDelegatePortal();
      } else if (state.view === 'instructor') {
        container.innerHTML = renderInstructorTablet();
      } else {
        container.innerHTML = renderClientWebsite();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
    render();
  </script>
</body>
</html>
